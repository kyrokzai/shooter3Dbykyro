<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>DARK ARENA — Mobile</title><style>
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#08090d;color:white;font-family:system-ui}canvas{width:100%;height:100%;display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;padding:12px 16px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 4px #000;pointer-events:none}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;color:#fff9;pointer-events:none}#stick{position:fixed;left:24px;bottom:calc(25px + env(safe-area-inset-bottom));width:124px;height:124px;border:2px solid #ffffff66;border-radius:50%;background:#ffffff16}#knob{position:absolute;left:39px;top:39px;width:42px;height:42px;border-radius:50%;background:#ffffffa0}#fire{position:fixed;right:25px;bottom:calc(36px + env(safe-area-inset-bottom));height:105px;width:105px;border-radius:100%;border:2px solid #ffb6b6;background:#a72139d9;color:white;font-size:18px;font-weight:900}#overlay{position:fixed;inset:0;background:#080910eb;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;z-index:5}h1{font-size:clamp(30px,9vw,54px);letter-spacing:4px;color:#ff5368;margin:0 0 12px}p{max-width:340px;line-height:1.5}#start{border:0;border-radius:12px;padding:18px 48px;font-size:20px;font-weight:900;background:#ed4c61;color:#fff;margin-top:15px}small{margin-top:20px;color:#b7b7c5;max-width:350px}#rotate{display:none;position:fixed;inset:0;z-index:9;background:#080910;color:white;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;font-size:20px;font-weight:700}#rotate span{font-size:60px;margin-bottom:20px}@media (orientation:portrait){#rotate{display:flex}}@media (orientation:landscape){#stick{left:calc(25px + env(safe-area-inset-left));bottom:22px;width:136px;height:136px}#knob{left:45px;top:45px}#fire{right:calc(28px + env(safe-area-inset-right));bottom:30px;width:112px;height:112px}#hud{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}}#err{color:#ffb2b2;font-size:12px;margin-top:12px}</style></head><body>
<div id="rotate"><span>↻</span>Поверни iPhone горизонтально, чтобы играть</div><canvas id="game"></canvas><div id="hud"><span id="hp">❤️ 100</span><span id="score">0 УБИЙСТВ · ВОЛНА 1</span></div><div id="cross">+</div><div id="stick"><div id="knob"></div></div><button id="fire">ОГОНЬ</button><div id="overlay"><h1>DARK ARENA</h1><p id="msg">Выживи в тёмной арене. Отбивай волны врагов.</p><button id="start" type="button">▶ ИГРАТЬ</button><small>Поверни телефон горизонтально. Левый круг — движение, справа — поворот. Кнопка ОГОНЬ — стрелять.</small><div id="err"></div></div>
<script>
(function(){'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),start=document.getElementById('start'),hpEl=document.getElementById('hp'),scoreEl=document.getElementById('score'),stick=document.getElementById('stick'),knob=document.getElementById('knob'),fire=document.getElementById('fire');
let W=0,H=0,scale=1,playing=false,health=100,kills=0,wave=1,px=0,pz=0,angle=0,moveX=0,moveY=0,shooting=false,lastShot=0,lastSpawn=0,flash=0,hurt=0,prev=0,stickId=null,lookId=null,lookX=0;
let enemies=[],particles=[];
function resize(){scale=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*scale);canvas.height=Math.round(H*scale);ctx.setTransform(scale,0,0,scale,0,0)}addEventListener('resize',resize);resize();document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
function spawn(){let a=Math.random()*Math.PI*2,d=9+Math.random()*8;enemies.push({x:Math.max(-18,Math.min(18,px+Math.cos(a)*d)),z:Math.max(-18,Math.min(18,pz+Math.sin(a)*d)),hp:2,hit:0,phase:Math.random()*6})}
function reset(){if(screen.orientation&&screen.orientation.lock){screen.orientation.lock("landscape").catch(()=>{});} health=100;kills=0;wave=1;px=0;pz=0;angle=0;enemies=[];particles=[];lastSpawn=performance.now();lastShot=0;shooting=false;moveX=moveY=0;knob.style.transform='';for(let i=0;i<4;i++)spawn();playing=true;overlay.style.display='none'}
start.addEventListener('click',reset);
function stickMove(e){let r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.max(1,Math.hypot(dx,dy));moveX=dx/l*Math.min(1,l/43);moveY=dy/l*Math.min(1,l/43);knob.style.transform=`translate(${moveX*39}px,${moveY*39}px)`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(stickId);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});function stopStick(){stickId=null;moveX=moveY=0;knob.style.transform=''}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);stick.addEventListener('lostpointercapture',stopStick);
canvas.addEventListener('pointerdown',e=>{lookId=e.pointerId;lookX=e.clientX;canvas.setPointerCapture(lookId)});canvas.addEventListener('pointermove',e=>{if(e.pointerId===lookId){angle+=(e.clientX-lookX)*.006;lookX=e.clientX}});canvas.addEventListener('pointerup',()=>lookId=null);canvas.addEventListener('pointercancel',()=>lookId=null);canvas.addEventListener('lostpointercapture',()=>lookId=null);
fire.addEventListener('pointerdown',e=>{e.preventDefault();shooting=true;fire.setPointerCapture(e.pointerId);shoot(performance.now())});fire.addEventListener('pointerup',()=>shooting=false);fire.addEventListener('pointercancel',()=>shooting=false);fire.addEventListener('lostpointercapture',()=>shooting=false);
function shoot(t){if(!playing||t-lastShot<220)return;lastShot=t;flash=1;let target=null,best=1e9;for(let e of enemies){let dx=e.x-px,dz=e.z-pz,d=Math.hypot(dx,dz),diff=Math.atan2(Math.sin(Math.atan2(dx,dz)-angle),Math.cos(Math.atan2(dx,dz)-angle));if(d<25&&Math.abs(diff)<Math.max(.055,.36/d)&&d<best){target=e;best=d}}if(target){target.hp--;target.hit=.18;if(target.hp<=0){enemies.splice(enemies.indexOf(target),1);kills++;wave=1+Math.floor(kills/8)}}}
function project(x,z){let dx=x-px,dz=z-pz,forward=dx*Math.sin(angle)+dz*Math.cos(angle),side=dx*Math.cos(angle)-dz*Math.sin(angle);if(forward<.3)return null;let focal=Math.min(W*1.0,H*1.25);return {x:W/2+side/forward*focal,y:H/2,sz:focal/forward,d:forward}}
function render(t){let horizon=H*.48;let sky=ctx.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#080a15');sky.addColorStop(1,'#36202c');ctx.fillStyle=sky;ctx.fillRect(0,0,W,horizon);let floor=ctx.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,'#30252c');floor.addColorStop(1,'#090a0e');ctx.fillStyle=floor;ctx.fillRect(0,horizon,W,H-horizon);
ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let d=2;d<=26;d+=2){let y=horizon+H*.55/d;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=-18;i<=18;i+=3){let a=project(i,20),b=project(i,-20);if(a&&b){ctx.beginPath();ctx.moveTo(a.x,horizon+H*.55/a.d);ctx.lineTo(b.x,horizon+H*.55/b.d);ctx.stroke()}}
let objects=[];for(let i=0;i<24;i++){let a=i/24*Math.PI*2,x=Math.sin(a)*19,z=Math.cos(a)*19,p=project(x,z);if(p)objects.push({type:'pillar',p})}for(let e of enemies){let p=project(e.x,e.z);if(p)objects.push({type:'enemy',p,e})}objects.sort((a,b)=>b.p.d-a.p.d);
for(let o of objects){let p=o.p;if(p.x< -p.sz||p.x>W+p.sz)continue;if(o.type==='pillar'){let w=Math.min(p.sz*.7,W),h=Math.min(p.sz*5,H*3);ctx.fillStyle='#191922';ctx.fillRect(p.x-w/2,horizon-h*.55,w,h);ctx.fillStyle='#6e2439';ctx.fillRect(p.x-w/2,horizon-h*.55,w*.13,h)}else{let e=o.e,s=Math.min(p.sz*1.75,H*3),bob=Math.sin(t*.004+e.phase)*s*.025,cy=horizon+s*.15+bob;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(p.x,cy+s*.43,s*.34,s*.07,0,0,7);ctx.fill();ctx.fillStyle=e.hit>0?'#ff9a9a':'#5e6672';ctx.fillRect(p.x-s*.2,cy-s*.34,s*.4,s*.54);ctx.fillStyle='#a78d8e';ctx.beginPath();ctx.arc(p.x,cy-s*.43,s*.15,0,7);ctx.fill();ctx.fillStyle='#ff334f';ctx.fillRect(p.x-s*.105,cy-s*.455,s*.21,Math.max(2,s*.025));ctx.fillStyle='#343943';ctx.fillRect(p.x-s*.32,cy-s*.3,s*.11,s*.42);ctx.fillRect(p.x+s*.21,cy-s*.3,s*.11,s*.42);ctx.fillRect(p.x-s*.18,cy+s*.2,s*.13,s*.31);ctx.fillRect(p.x+s*.05,cy+s*.2,s*.13,s*.31)}}
let gx=W*.57,gy=H*.93;ctx.fillStyle='#141922';ctx.fillRect(gx-22,gy-95,65,115);ctx.fillStyle='#565e6b';ctx.fillRect(gx+2,gy-130,22,75);ctx.fillStyle='#303744';ctx.fillRect(gx-12,gy-75,48,50);if(flash>0){ctx.fillStyle=`rgba(255,177,77,${flash*.9})`;ctx.beginPath();ctx.arc(gx+13,gy-134,18+flash*24,0,7);ctx.fill()}if(hurt>0){ctx.fillStyle=`rgba(220,20,50,${hurt*.2})`;ctx.fillRect(0,0,W,H)}}
function frame(t){let dt=Math.min(.05,(t-(prev||t))/1000);prev=t;if(playing){let speed=5*dt;px+=(Math.cos(angle)*moveX-Math.sin(angle)*moveY)*speed;pz+=(-Math.sin(angle)*moveX-Math.cos(angle)*moveY)*speed;px=Math.max(-18,Math.min(18,px));pz=Math.max(-18,Math.min(18,pz));if(shooting)shoot(t);if(t-lastSpawn>Math.max(650,2300-wave*110)&&enemies.length<Math.min(20,5+wave*2)){spawn();lastSpawn=t}for(let e of enemies){let dx=px-e.x,dz=pz-e.z,d=Math.hypot(dx,dz);if(d>1){e.x+=dx/d*dt*(1.3+wave*.16);e.z+=dz/d*dt*(1.3+wave*.16)}else if(!e.attack||t-e.attack>1100){health-=9;e.attack=t;hurt=1}e.hit=Math.max(0,e.hit-dt)}flash=Math.max(0,flash-dt*7);hurt=Math.max(0,hurt-dt*2);hpEl.textContent='❤️ '+Math.max(0,health);scoreEl.textContent=`${kills} УБИЙСТВ · ВОЛНА ${wave}`;if(health<=0){playing=false;shooting=false;overlay.style.display='flex';document.querySelector('#overlay h1').textContent='ИГРА ОКОНЧЕНА';document.getElementById('msg').textContent=`Уничтожено врагов: ${kills}. Попробуй снова!`;start.textContent='↻ ЕЩЁ РАЗ'}}render(t);requestAnimationFrame(frame)}requestAnimationFrame(frame);
addEventListener('keydown',e=>{if(e.key==='Enter'&&!playing)reset();if(e.code==='Space')shoot(performance.now())});window.addEventListener('error',e=>{document.getElementById('err').textContent=e.message||'Ошибка запуска'});})();
</script></body></html>
